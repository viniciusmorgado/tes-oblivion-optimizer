# Default feature: cost trims independent of the GI choice (VSM, fog, clouds, grass, post, streaming)
; --- Virtual Shadow Maps: "High" sets LOD bias -0.5 and 8 SMRT rays; this is between Medium and High
r.Shadow.Virtual.ResolutionLodBiasDirectional=0.0
r.Shadow.Virtual.ResolutionLodBiasDirectionalMoving=0.5
r.Shadow.Virtual.ResolutionLodBiasLocal=1.0
r.Shadow.Virtual.ResolutionLodBiasLocalMoving=2.0
r.Shadow.Virtual.SMRT.RayCountDirectional=4
r.Shadow.Virtual.SMRT.SamplesPerRayDirectional=2
r.Shadow.Virtual.SMRT.RayCountLocal=4
r.Shadow.Virtual.SMRT.SamplesPerRayLocal=2
r.Shadow.Virtual.MaxPhysicalPages=2048
; --- Volumetric fog: High uses a 16px grid with 4x supersampling on history misses
r.VolumetricFog.GridPixelSize=24
r.VolumetricFog.GridSizeZ=64
r.VolumetricFog.HistoryMissSupersampleCount=1
; --- Volumetric clouds: fewer ray samples, keep cloud shadows
r.VolumetricCloud.ViewRaySampleMaxCount=384
r.VolumetricCloud.ReflectionRaySampleMaxCount=40
r.VolumetricCloud.ShadowMap.MaxResolution=256
; --- Grass / foliage: High is 0.8; grass is one of the heaviest exterior costs in this game
grass.densityScale=0.6
foliage.DensityScale=0.6
foliage.LODDistanceScale=0.8
; --- Post-processing trims that are nearly invisible with DLSS
r.LensFlareQuality=0
r.SceneColorFringeQuality=0
r.Bloom.ScreenPercentage=35.355
r.Tonemapper.Quality=2
r.MotionBlur.HalfResGather=1
; --- Sky atmosphere: Medium-level sample counts (High = 64)
r.SkyAtmosphere.SampleCountMax=32
r.SkyAtmosphere.FastSkyLUT.SampleCountMax=32
; --- Subsurface scattering at half res (already) with cheaper sample set
r.SSS.SampleSet=0
; --- Texture streaming: game sets 2000 MB pool at High; raise a little to avoid re-streaming hitches on 8 GB
r.Streaming.PoolSize=2300
r.Streaming.LimitPoolSizeToVRAM=0

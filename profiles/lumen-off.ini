# Lumen off the community-tested way (LUMEN BEGONE route): GI method stays Lumen but is disallowed; skylight + DFAO
r.Lumen.DiffuseIndirect.Allow=0
r.Lumen.Reflections.Allow=0
r.Lumen.TranslucencyReflections.FrontLayer.Allow=0
r.Lumen.TranslucencyReflections.FrontLayer.Enable=0
r.Lumen.HardwareRayTracing=0
r.Lumen.TraceMeshSDFs.Allow=0
; reflections fall back to SSR (menu toggle still works) + sky capture
r.ReflectionMethod=2
r.SkyLight.RealTimeReflectionCapture=1
; DFAO keeps some contact shading; if small foliage shimmers, add --feature dfao-off
r.DistanceFieldAO=1
r.AOQuality=1
r.AmbientOcclusionLevels=2
r.AmbientOcclusionMaxQuality=60
r.SkylightIntensityMultiplier=0.8

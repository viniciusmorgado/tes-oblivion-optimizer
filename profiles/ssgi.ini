# Lumen off, Screen Space GI forced as the GI method, DFAO kept (experimental: not community-tested in this game)
r.DynamicGlobalIlluminationMethod=2
r.ReflectionMethod=2
r.Lumen.DiffuseIndirect.Allow=0
r.Lumen.Reflections.Allow=0
r.Lumen.TranslucencyReflections.FrontLayer.Allow=0
r.Lumen.TranslucencyReflections.FrontLayer.Enable=0
r.Lumen.HardwareRayTracing=0
r.Lumen.TraceMeshSDFs.Allow=0
; Screen Space GI: 1..4 (3 keeps colour bleed without the full-res trace)
r.SSGI.Quality=3
r.SSGI.LeakFreeReprojection=1
; Keep some ambient term so interiors do not go flat: DFAO + SSAO (foliage shimmer? add --feature dfao-off)
r.DistanceFieldAO=1
r.AOQuality=1
r.AmbientOcclusionLevels=2
r.AmbientOcclusionMaxQuality=60
r.SkyLight.RealTimeReflectionCapture=1
; Epic's Low-GI compensation: the skylight is bright in this game once Lumen stops shadowing it
r.SkylightIntensityMultiplier=0.8

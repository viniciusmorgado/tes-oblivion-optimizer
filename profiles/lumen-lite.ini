# Keep Lumen GI (software) but at console-class cost; Lumen reflections replaced by SSR
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=2
r.Lumen.Reflections.Allow=0
r.Lumen.TranslucencyReflections.FrontLayer.Allow=0
r.Lumen.TranslucencyReflections.FrontLayer.Enable=0
r.Lumen.HardwareRayTracing=0
; High re-enables mesh-SDF tracing (expensive); trace the global SDF only
r.Lumen.TraceMeshSDFs.Allow=0
; Surface cache / card capture budget (values between Series S profile and PC High)
r.LumenScene.SurfaceCache.AtlasSize=2048
r.LumenScene.SurfaceCache.CardTexelDensityScale=50
r.LumenScene.SurfaceCache.CardMaxResolution=256
r.LumenScene.SurfaceCache.CardCaptureFactor=32
r.LumenScene.GlobalSDF.Resolution=128
r.LumenScene.GlobalSDF.SimpleCoverageBasedExpand=1
r.LumenScene.Radiosity.ProbeSpacing=8
r.LumenScene.Radiosity.HemisphereProbeResolution=3
; Final gather
r.Lumen.ScreenProbeGather.DownsampleFactor=32
r.Lumen.ScreenProbeGather.TracingOctahedronResolution=8
r.Lumen.ScreenProbeGather.RadianceCache.ProbeResolution=16
r.Lumen.ScreenProbeGather.RadianceCache.ProbeAtlasResolutionInProbes=64
r.Lumen.ScreenProbeGather.RadianceCache.NumProbesToTraceBudget=200
r.Lumen.ScreenProbeGather.ShortRangeAO=0
r.Lumen.DiffuseIndirect.SSAO=1
r.Lumen.TranslucencyVolume.GridPixelSize=64
r.Lumen.TranslucencyVolume.TraceFromVolume=0
r.Lumen.TranslucencyVolume.RadianceCache.ProbeResolution=8
